<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A BIZ SYSTEM – UZA</title>
  <style>
    :root, [data-theme="dark"] {
      --bg: #0b1220;
      --panel: #111827;
      --panel-2: #1a2332;
      --border: #1f2a3c;
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --accent: #14b8a6;
      --accent-hover: #0d9488;
      --danger: #ef4444;
      --shadow: 0 4px 24px rgba(0,0,0,0.35);
      --logo-bg: #0f172a;
      --input-bg: #1a2332;
      --card-hover: rgba(20, 184, 166, 0.08);
    }

    [data-theme="light"] {
      --bg: #f1f5f9;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #0d9488;
      --accent-hover: #0f766e;
      --danger: #dc2626;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
      --logo-bg: #0f172a;
      --input-bg: #ffffff;
      --card-hover: rgba(13, 148, 136, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .laptop {
      width: 100%;
      max-width: 1100px;
      background: var(--panel);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 640px;
      transition: background 0.25s, border-color 0.25s;
    }

    .topbar {
      display: flex;
      align-items: center;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      height: 52px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      height: 100%;
      background: var(--logo-bg);
      border-right: 1px solid var(--border);
      min-width: 180px;
      color: #f8fafc;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.3px;
    }

    .page-title {
      flex: 1;
      padding: 0 20px;
    }

    .page-title h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .page-title p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .theme-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-right: 16px;
    }

    .theme-btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .theme-btn:hover { border-color: var(--accent); color: var(--accent); }
    .theme-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .main { display: flex; flex: 1; overflow: hidden; }

    .sidebar {
      width: 180px;
      background: var(--panel-2);
      border-right: 1px solid var(--border);
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .menu-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      padding: 0 8px 6px;
    }

    .menu-btn {
      display: block;
      padding: 10px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: all 0.15s;
    }

    .menu-btn:hover { background: var(--card-hover); }
    .menu-btn.active { background: var(--accent); color: #fff; }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .content { flex: 1; display: flex; overflow: hidden; }

    .products-panel {
      flex: 1;
      padding: 18px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .search-box { position: relative; }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .search-box input:focus { border-color: var(--accent); }

    .search-box::before {
      content: "⌕";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--text-muted);
    }

    .available-count {
      font-size: 12px;
      color: var(--text-muted);
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .product-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      transition: border-color 0.15s, background 0.15s;
    }

    .product-card:hover {
      border-color: var(--accent);
      background: var(--card-hover);
    }

    .product-name {
      font-weight: 500;
      font-size: 13px;
    }

    .product-price {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-add {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-add:hover { background: var(--accent-hover); }

    .receipt-panel {
      width: 300px;
      background: var(--panel-2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .receipt-header {
      padding: 16px 18px 10px;
      border-bottom: 1px solid var(--border);
    }

    .receipt-header h2 {
      font-size: 14px;
      font-weight: 700;
    }

    .receipt-meta {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .receipt-meta strong { color: var(--text); }

    .receipt-items {
      flex: 1;
      overflow-y: auto;
      padding: 10px 18px;
    }

    .receipt-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 9px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 12px;
    }

    .receipt-item:last-child { border-bottom: none; }

    .item-name { font-weight: 500; }
    .item-qty { color: var(--text-muted); font-size: 11px; margin-top: 1px; }

    .item-right {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }

    .item-price { font-weight: 500; }

    .btn-remove {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 11px;
      cursor: pointer;
      opacity: 0.75;
    }

    .btn-remove:hover { opacity: 1; }

    .receipt-empty {
      text-align: center;
      color: var(--text-muted);
      padding: 36px 16px;
      font-size: 12px;
    }

    .receipt-totals {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,0.04);
    }

    [data-theme="dark"] .receipt-totals {
      background: rgba(0,0,0,0.18);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 5px;
      color: var(--text-muted);
    }

    .total-row.grand {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
    }

    .receipt-actions {
      padding: 14px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .footer {
      height: 28px;
      background: var(--panel-2);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--panel);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 13px;
      box-shadow: var(--shadow);
      opacity: 0;
      transition: all 0.25s;
      z-index: 100;
      border: 1px solid var(--accent);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 800px) {
      .laptop { height: auto; max-height: 95vh; }
      .sidebar { display: none; }
      .receipt-panel { width: 260px; }
      .theme-btn .label { display: none; }
    }
  </style>
</head>
<body>
  <div class="laptop">
    <div class="topbar">
      <div class="logo">A BIZ SYSTEM</div>
      <div class="page-title">
        <h1>UZA - Mauzo Mapya</h1>
        <p>Unda mauzo mapya na chapisha resiti</p>
      </div>
      <div class="theme-controls">
        <button class="theme-btn" id="btnSystem" onclick="setTheme('system')">Kifaa</button>
        <button class="theme-btn" id="btnLight" onclick="setTheme('light')">Mwanga</button>
        <button class="theme-btn" id="btnDark" onclick="setTheme('dark')">Giza</button>
      </div>
    </div>

    <div class="main">
      <div class="sidebar">
        <div class="menu-label">MENYU</div>
        <button class="menu-btn active">UZA</button>
        <button class="menu-btn">STOCK</button>
        <button class="menu-btn">ONGEZA BIDHAA</button>
        <button class="menu-btn">MADENI</button>
        <div class="sidebar-footer">
          <button class="menu-btn">Mipangilio</button>
          <button class="menu-btn">Toka</button>
        </div>
      </div>

      <div class="content">
        <div class="products-panel">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tafuta bidhaa..." oninput="filterProducts()" />
          </div>
          <div class="available-count" id="availableCount">Bidhaa Zinazopatikana: 0</div>
          <div class="product-list" id="productList"></div>
        </div>

        <div class="receipt-panel">
          <div class="receipt-header">
            <h2>RESITI</h2>
            <div class="receipt-meta">
              Resiti #: <strong id="receiptNo">001234</strong><br />
              Tarehe: <strong id="receiptDate">—</strong><br />
              Mteja: <strong>Mteja wa Kawaida</strong>
            </div>
          </div>

          <div class="receipt-items" id="receiptItems">
            <div class="receipt-empty">Hakuna bidhaa bado.<br />Ongeza kutoka kushoto.</div>
          </div>

          <div class="receipt-totals">
            <div class="total-row">
              <span>Jumla Ndogo:</span>
              <span id="subtotal">0 TZS</span>
            </div>
            <div class="total-row">
              <span>Punguzo:</span>
              <span id="discount">0 TZS</span>
            </div>
            <div class="total-row grand">
              <span>JUMLA:</span>
              <span id="grandTotal">0 TZS</span>
            </div>
          </div>

          <div class="receipt-actions">
            <button class="btn-primary" id="btnPrint" onclick="printReceipt()" disabled>CHAPISHA RESITI</button>
            <button class="btn-secondary" id="btnComplete" onclick="completeSale()" disabled>SAFIRISHA MAUZO</button>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      A BIZ SYSTEM · Toleo 1.2 · <span id="themeLabel">Modi: Giza</span>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const THEME_KEY = 'abiz-theme';

    function getSystemTheme() {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function applyTheme(theme) {
      const resolved = theme === 'system' ? getSystemTheme() : theme;
      document.documentElement.setAttribute('data-theme', resolved);
      document.getElementById('btnSystem').classList.toggle('active', theme === 'system');
      document.getElementById('btnLight').classList.toggle('active', theme === 'light');
      document.getElementById('btnDark').classList.toggle('active', theme === 'dark');
      const labels = { system: 'Kifaa', light: 'Mwanga', dark: 'Giza' };
      document.getElementById('themeLabel').textContent = 'Modi: ' + labels[theme];
    }

    function setTheme(theme) {
      localStorage.setItem(THEME_KEY, theme);
      applyTheme(theme);
      showToast(theme === 'system' ? 'Inafuata mpangilio wa kifaa' :
                theme === 'light' ? 'Mwanga umewashwa' : 'Giza limewashwa');
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if ((localStorage.getItem(THEME_KEY) || 'system') === 'system') applyTheme('system');
    });

    applyTheme(localStorage.getItem(THEME_KEY) || 'system');

    const products = [
      { id: 1, name: "Sabuni ya Ndoo", price: 3000 },
      { id: 2, name: "Maziwa ya Poda", price: 5000 },
      { id: 3, name: "Mchele 1kg", price: 4000 },
      { id: 4, name: "Sukari 1kg", price: 2800 },
      { id: 5, name: "Mafuta ya Kupikia 1L", price: 4500 },
      { id: 6, name: "Unga wa Ngano 1kg", price: 2200 },
      { id: 7, name: "Chai 100g", price: 1500 },
      { id: 8, name: "Sabuni ya Mikono", price: 1200 },
      { id: 9, name: "Toothpaste", price: 2500 },
      { id: 10, name: "Tissue", price: 1800 },
      { id: 11, name: "Omo 500g", price: 3500 },
      { id: 12, name: "Majani ya Chai", price: 2000 }
    ];

    let cart = [];

    function formatMoney(n) {
      return n.toLocaleString('en-TZ') + ' TZS';
    }

    function updateDateTime() {
      const now = new Date();
      const options = { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
      document.getElementById('receiptDate').textContent = now.toLocaleString('en-GB', options).replace(',', ' •');
    }

    function renderProducts(filter = '') {
      const list = document.getElementById('productList');
      const filtered = products.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()));
      document.getElementById('availableCount').textContent = `Bidhaa Zinazopatikana: ${filtered.length}`;

      if (filtered.length === 0) {
        list.innerHTML = `<div style="color:var(--text-muted);padding:16px;text-align:center;font-size:13px;">Hakuna bidhaa iliyopatikana</div>`;
        return;
      }

      list.innerHTML = filtered.map(p => `
        <div class="product-card">
          <div>
            <div class="product-name">${p.name}</div>
            <div class="product-price">${formatMoney(p.price)}</div>
          </div>
          <button class="btn-add" onclick="addToCart(${p.id})">+ Ongeza</button>
        </div>
      `).join('');
    }

    function filterProducts() {
      renderProducts(document.getElementById('searchInput').value);
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;
      const existing = cart.find(c => c.id === id);
      if (existing) existing.qty += 1;
      else cart.push({ ...product, qty: 1 });
      renderCart();
      showToast(product.name + ' imeongezwa');
    }

    function removeFromCart(id) {
      cart = cart.filter(c => c.id !== id);
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('receiptItems');
      const btnPrint = document.getElementById('btnPrint');
      const btnComplete = document.getElementById('btnComplete');

      if (cart.length === 0) {
        container.innerHTML = `<div class="receipt-empty">Hakuna bidhaa bado.<br />Ongeza kutoka kushoto.</div>`;
        btnPrint.disabled = true;
        btnComplete.disabled = true;
      } else {
        container.innerHTML = cart.map(item => `
          <div class="receipt-item">
            <div>
              <div class="item-name">${item.qty}× ${item.name}</div>
              <div class="item-qty">${formatMoney(item.price)} kila moja</div>
            </div>
            <div class="item-right">
              <div class="item-price">${formatMoney(item.price * item.qty)}</div>
              <button class="btn-remove" onclick="removeFromCart(${item.id})">Ondoa</button>
            </div>
          </div>
        `).join('');
        btnPrint.disabled = false;
        btnComplete.disabled = false;
      }

      const subtotal = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      document.getElementById('subtotal').textContent = formatMoney(subtotal);
      document.getElementById('discount').textContent = '0 TZS';
      document.getElementById('grandTotal').textContent = formatMoney(subtotal);
    }

    function printReceipt() {
      if (cart.length === 0) return;
      showToast('Resiti inachapishwa...');
    }

    function completeSale() {
      if (cart.length === 0) return;
      const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
      showToast('Mauzo yamekamilika! Jumla: ' + formatMoney(total));
      cart = [];
      document.getElementById('receiptNo').textContent = String(Math.floor(100000 + Math.random() * 900000)).padStart(6, '0');
      updateDateTime();
      renderCart();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    updateDateTime();
    renderProducts();
    renderCart();
    setInterval(updateDateTime, 60000);
  </script>
</body>
</html>
